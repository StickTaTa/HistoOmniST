name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,hest,wsi]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Public release audit
        run: python scripts/audit_public_release.py
      - name: Validate notebooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("notebooks").glob("*.ipynb"))
          assert [path.name for path in files] == ["00_quickstart_inference.ipynb"]
          for path in files:
              notebook = json.loads(path.read_text(encoding="utf-8"))
              for cell in notebook["cells"]:
                  if cell.get("cell_type") == "code":
                      compile("".join(cell.get("source", [])), str(path), "exec")
          print(f"validated {len(files)} notebooks")
          PY
